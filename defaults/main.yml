---

required_modifiable_fields:
  - app_version
  - server_port
  - installation_root_folder
  - java_version
  - installer_checksum
  - custom_download_username
  - custom_download_password

app_name: cloudagent
__app_version: 26.8.26522

darwin_installer_checksum: "676cd4cef57c4e3782c2db834ea8d91abd246d9812d49b36722e8e8b80c32530"
windows_installer_checksum: "b220d615a139e10e486d01f1662214063a2724441a4bf62b714473e451995051"

service_name: "com.experitest.{{ app_name }}"
main_class: "com.experitest.cloudagent.MainForwarder"

# OpenTelemetry Configuration
otel_enabled: false
otel_version: "2.23.0"
otel_download_url: "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v{{ otel_version }}/opentelemetry-javaagent.jar"
otel_jar_name: "opentelemetry-javaagent.jar"
otel_jar_full_path: "{{ installation_root_folder }}/otel/{{ otel_jar_name }}"

otel_service_name: "{{ app_name }}"
otel_environment: "prod"
otel_namespace: "daict"
otel_customer: "default"
otel_alloy_endpoint: "http://{{ otel_alloy_host }}:{{ otel_alloy_port }}"
otel_alloy_host: "localhost"
otel_alloy_port: 4317

otel_java_options:
  - "-javaagent:{{ otel_jar_full_path }}"
  - "-Dotel.service.name={{ otel_service_name }}"
  - "-Dotel.resource.attributes=deployment.environment={{ otel_environment }},service.namespace={{ otel_namespace }},customer={{ otel_customer }}"
  - "-Dotel.exporter.otlp.endpoint={{ otel_alloy_endpoint }}"
  - "-Dotel.exporter.otlp.protocol=grpc"
  - "-Dotel.metrics.exporter=otlp"
  - "-Dotel.logs.exporter=otlp"

# Keep user-provided extra JVM options separate from OTEL options
extra_java_options: []

# Add OTEL options only when enabled
enabled_otel_java_options: "{{ otel_java_options if otel_enabled else [] }}"

base_java_options: []

# Final JVM options used by startup scripts/templates
java_options: "{{ base_java_options + extra_java_options + enabled_otel_java_options }}"

__server_port: 8081

__java_version: 25.0.4_7

# 

base_application_properties:
  - "server.port": "{{ server_port }}"

extra_application_properties: {}

application_properties: "{{ base_application_properties | combine(extra_application_properties) }}"

# 

base_xml_conf:
  - "main-port": "{{ server_port }}"

extra_xml_conf: {}

xml_conf: "{{ base_xml_conf | combine(extra_xml_conf) }}"

#

extra_grid_logback_properties: {}

grid_logback_properties: "{{ extra_grid_logback_properties }}"

#

extra_logback_properties: {}

logback_properties: "{{ extra_logback_properties }}"

#

start_after_install: True

clear_temp_folder: False
clear_before_install: False

kill_notepad: False

maintain_supervision_files: False

convention: "Agent"

custom_download_url: ""

cdn_name: "devops-artifacts.experitest.com"
s3_download_url: "https://{{ cdn_name }}/{{ relative_path }}/{{ installer_file_name }}"

java_download_url: "https://{{ cdn_name }}/{{ java_relative_path }}/{{ java_download_filename }}"

# ---------------------------------------------------------------------------
# Rosetta 2 / x86_64 Java workaround (macOS Apple Silicon only, opt-in).
# Temporary workaround for native library dependencies (e.g. Xuggler) that are
# not compatible with arm64. When enabled, the agent is launched through
# Rosetta 2 (`arch -x86_64`) using an x86_64 JDK instead of the native arm64
# JRE. This must be enabled per-customer via feature flag, only for hosts
# where the workaround has been validated.
#
# Prerequisite (not managed by this role, must be done on the host first):
#   1. Install Rosetta 2 (`softwareupdate --install-rosetta --agree-to-license`)
# The x86_64 JDK itself is downloaded and installed by this role (see below).
#
# NOTE: Rosetta 2 is being phased out by Apple - macOS 27 (Golden Gate) is the
# last release with full Rosetta support, and macOS 28 (Fall 2027) removes it
# for all but a small set of legacy games. This is a stopgap only.
# Permanent fix tracked in SA-60348 (replace Xuggler with an ARM64-compatible
# video library).
# ---------------------------------------------------------------------------
rosetta_x86_java_enabled: false

# Only apply the Rosetta workaround on Apple Silicon hosts, and only when explicitly enabled.
rosetta_active: "{{ rosetta_x86_java_enabled | bool and ansible_architecture == 'arm64' }}"

cmd_prefix: "{{ 'exec arch -x86_64' if rosetta_active else '' }}"

# x86_64 JDK downloaded for the Rosetta workaround (Xuggler and other native libs need a real x86_64 JVM).
rosetta_java_version: "25.0.4_7"
rosetta_java_major_version: "{{ rosetta_java_version.split('.')[0] }}"
rosetta_java_relative_path: "java/osx"
rosetta_java_download_filename: "OpenJDK{{ rosetta_java_major_version }}U-jre_x64_mac_hotspot_{{ rosetta_java_version }}.tar.gz"
rosetta_java_download_url: "https://{{ cdn_name }}/{{ rosetta_java_relative_path }}/{{ rosetta_java_download_filename }}"
rosetta_java_installation_folder: "{{ installation_root_folder }}/jre-x86_64"
rosetta_java_bin: "{{ rosetta_java_installation_folder }}/jdk{{ rosetta_java_version }}-jre/Contents/Home/bin/java"

# Binary actually used to launch the agent, x86_64 JDK when the Rosetta workaround is active.
effective_java_bin: "{{ rosetta_java_bin if rosetta_active else java_bin }}"
