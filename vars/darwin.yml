---

__installation_root_folder: "/Applications/Experitest"
installation_folder: "{{ installation_root_folder }}/{{ app_name }}-{{ app_version }}"

__installer_checksum: "{{ darwin_installer_checksum }}"

temp_folder: "/tmp/experitest"

logs_folder: "/Library/Experitest/{{ app_name }}/logs"

service_plist_file_path: "/Library/LaunchDaemons/{{ service_name }}.plist"

installer_file_name: "dist-Mac-AGENT-{{ app_version }}.zip"

relative_path: "cloud-agent/osx"

launcher_file_name: "start.sh"

java_download_filename: "OpenJDK8U-jre_x64_mac_hotspot_{{ java_version }}.tar.gz"

java_relative_path: "java/osx"

java_installation_folder: "{{ installation_root_folder }}/jre"

java_bin: "{{ java_installation_folder }}/jdk{{ java_version }}-jre/Contents/Home/bin/java"

__custom_download_username: "myuser"
__custom_download_password: "mypassword"

carplay_custom_download_url: ""

carplay_temp_dir: "/tmp/carplay-xcuitest-service"
carplay_zip_name: "dist-MAC-CARPLAY-SERVICE-{{ app_version }}.zip"
carplay_installation_dir: "{{ installation_folder }}"
carplay_lib_dir: "{{ carplay_installation_dir }}/lib"
carplay_xcuitest_dest_dir: "/Users/Shared/carplay-xcuitest-service"

carplay_service_label: "com.experitest.carplay.xcuitest.service"
carplay_plist_dest: "/Library/LaunchDaemons/{{ carplay_service_label }}.plist"

carplay_service_class: "com.experitest.carplay.xcuitest.impl.CarPlayXCUITestApplication"

carplay_service_name: "carplay-xcuitest-service"

carplay_service_port: 9726